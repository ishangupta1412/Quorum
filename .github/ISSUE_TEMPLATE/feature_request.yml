name: Feature Request
description: Suggest a new detection family, export format, or UI improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please be as specific as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? What is currently missing?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you would like.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection (new family / improved logic)
        - Export (STIX / Sentinel / CSV / new format)
        - UI / Visualization
        - API
        - Testing / Red-team
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you have considered.

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this myself and open a PR
