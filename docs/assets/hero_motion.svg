<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" width="100%" height="290">
  <defs>
    <!-- Background Cyber Gradients -->
    <linearGradient id="cyberCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="45%" stop-color="#071026" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>

    <!-- Metallic Microsoft Azure Header Gradient -->
    <linearGradient id="quorumMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Electric Azure Accent -->
    <linearGradient id="azureGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="50%" stop-color="#00BCF2" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Adversary Threat Crimson Accent -->
    <linearGradient id="threatCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Hairline Security Border -->
    <linearGradient id="securityBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="35%" stop-color="#00D2FF" />
      <stop offset="65%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Refined Scanning Laser Sweep -->
    <linearGradient id="sweepLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCF2" stop-opacity="0" />
      <stop offset="50%" stop-color="#00BCF2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00BCF2" stop-opacity="0" />
    </linearGradient>

    <!-- High-Precision Dot Matrix Grid -->
    <pattern id="socGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#38BDF8" fill-opacity="0.08" />
    </pattern>

    <!-- Soft Ambient Light Filter -->
    <filter id="azureHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="crimsonHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-350px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(1150px); opacity: 0; }
    }
    @keyframes pulseThreat {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes pivotFlash {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 2px #F59E0B); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #F59E0B); }
    }
    @keyframes flowEdge {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    .spin-cw {
      animation: spinCW 28s linear infinite;
      transform-origin: 835px 145px;
    }
    .spin-ccw {
      animation: spinCCW 20s linear infinite;
      transform-origin: 835px 145px;
    }
    .laser-beam {
      animation: sweepLine 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .threat-pulse {
      animation: pulseThreat 2.2s ease-in-out infinite;
      transform-origin: center;
    }
    .pivot-pulse {
      animation: pivotFlash 1.8s ease-in-out infinite;
    }
    .edge-animated {
      animation: flowEdge 3s linear infinite;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, monospace;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="980" height="290" rx="14" fill="url(#cyberCanvas)" stroke="#1E293B" stroke-width="1.2" />
  <rect width="980" height="290" rx="14" fill="url(#socGrid)" />

  <!-- Ambient Light Halos -->
  <circle cx="835" cy="145" r="160" fill="#0078D4" opacity="0.09" filter="url(#azureHalo)" />
  <circle cx="160" cy="50" r="130" fill="#EF4444" opacity="0.05" filter="url(#crimsonHalo)" />

  <!-- Top Hairline Security Accent -->
  <rect x="0" y="0" width="980" height="2.5" rx="1" fill="url(#securityBorder)" />

  <!-- Sweep Laser Line -->
  <rect class="laser-beam" x="0" y="1" width="220" height="1.5" fill="url(#sweepLaser)" />

  <!-- ================= LEFT SOC ENGINE SPECIFICATION ================= -->

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 44)">
    <!-- Live Operational Dot with Ping -->
    <circle cx="6" cy="6" r="3.5" fill="#10B981" />
    <circle cx="6" cy="6" r="3.5" fill="#10B981" opacity="0.6">
      <animate attributeName="r" values="3.5;10;3.5" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Authority Hierarchy Typography -->
    <text x="24" y="9.5" fill="#94A3B8" class="font-mono" font-size="11" font-weight="600" letter-spacing="1.2">
      MICROSOFT INNOVATE 2026 • REDMOND LABS • ENTERPRISE SOC
    </text>

    <!-- Sentinel Integration Badge -->
    <rect x="525" y="-3" width="138" height="19" rx="4" fill="#0F172A" stroke="#0078D4" stroke-width="0.8" />
    <circle cx="536" cy="6.5" r="2.5" fill="#00BCF2" />
    <text x="544" y="10" fill="#E2E8F0" class="font-mono" font-size="9.5" font-weight="600" letter-spacing="0.5">
      SENTINEL &amp; STIX 2.1
    </text>
  </g>

  <!-- Hero Platform Branding -->
  <g transform="translate(48, 116)">
    <!-- Quorum Main Title -->
    <text class="font-sans" x="0" y="0" font-size="46" font-weight="900" fill="url(#quorumMetallic)" letter-spacing="-0.5">
      QUORUM
    </text>

    <!-- Microsoft Security Blue Shield Icon & Badge -->
    <rect x="228" y="-33" width="132" height="20" rx="4" fill="#0078D4" fill-opacity="0.18" stroke="#0078D4" stroke-width="0.8" />
    <text x="236" y="-19.5" fill="#38BDF8" class="font-mono" font-size="9.5" font-weight="700" letter-spacing="0.8">
      CORRELATION ENGINE
    </text>
  </g>

  <!-- Technical Mission Tagline -->
  <g transform="translate(48, 148)">
    <text class="font-sans" x="0" y="0" font-size="14.5" fill="#94A3B8" font-weight="400" letter-spacing="0.2">
      Autonomous Bipartite Correlation Engine Countering Midnight Blizzard (NOBELIUM)
    </text>
  </g>

  <!-- Precision Pillar Badges (Glassmorphism) -->
  <g transform="translate(48, 192)">
    <!-- Badge 1: Union-Find Graph -->
    <rect x="0" y="0" width="170" height="34" rx="7" fill="#0B1329" fill-opacity="0.8" stroke="#0078D4" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="17" r="3.5" fill="#38BDF8" />
    <text x="28" y="21" fill="#F1F5F9" class="font-sans" font-size="12" font-weight="600" letter-spacing="0.2">Bipartite Graph</text>
    <rect x="126" y="9" width="34" height="16" rx="3" fill="#1E293B" />
    <text x="130" y="20.5" fill="#94A3B8" class="font-mono" font-size="8.5" font-weight="600">O(αN)</text>

    <!-- Badge 2: Consensus Arithmetic -->
    <rect x="180" y="0" width="170" height="34" rx="7" fill="#0B1329" fill-opacity="0.8" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="196" cy="17" r="3.5" fill="#10B981" />
    <text x="208" y="21" fill="#F1F5F9" class="font-sans" font-size="12" font-weight="600" letter-spacing="0.2">Consensus Multiplier</text>
    <rect x="320" y="9" width="22" height="16" rx="3" fill="#1E293B" />
    <text x="323" y="20.5" fill="#94A3B8" class="font-mono" font-size="8.5" font-weight="600">F13</text>

    <!-- Badge 3: SHA-256 Tamper Ledger -->
    <rect x="360" y="0" width="168" height="34" rx="7" fill="#0B1329" fill-opacity="0.8" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="376" cy="17" r="3.5" fill="#F59E0B" />
    <text x="388" y="21" fill="#F1F5F9" class="font-sans" font-size="12" font-weight="600" letter-spacing="0.2">SHA-256 Ledger</text>
    <rect x="484" y="9" width="34" height="16" rx="3" fill="#1E293B" />
    <text x="488" y="20.5" fill="#94A3B8" class="font-mono" font-size="8.5" font-weight="600">AUDIT</text>

    <!-- Badge 4: Zero-FP Thresholding -->
    <rect x="538" y="0" width="166" height="34" rx="7" fill="#0B1329" fill-opacity="0.8" stroke="#EC4899" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="554" cy="17" r="3.5" fill="#EC4899" />
    <text x="566" y="21" fill="#F1F5F9" class="font-sans" font-size="12" font-weight="600" letter-spacing="0.2">Zero-FP Consensus</text>
    <rect x="672" y="9" width="23" height="16" rx="3" fill="#1E293B" />
    <text x="676" y="20.5" fill="#94A3B8" class="font-mono" font-size="8.5" font-weight="600">55T</text>
  </g>

  <!-- ================= RIGHT BIPARTITE GRAPH THREAT VISUALIZER ================= -->
  <g id="bipartiteAttackVisualizer" transform="translate(0, 0)">
    <!-- Outer Precision Caliper Ring (Counter-Clockwise) -->
    <g class="spin-ccw">
      <circle cx="835" cy="145" r="88" fill="none" stroke="#0078D4" stroke-width="1" stroke-dasharray="4 12 2 12" stroke-opacity="0.45" />
      <circle cx="835" cy="57" r="3" fill="#00BCF2" opacity="0.8" />
      <circle cx="835" cy="233" r="3" fill="#00BCF2" opacity="0.8" />
    </g>

    <!-- Mid Caliper Degree Ring (Clockwise) -->
    <g class="spin-cw">
      <circle cx="835" cy="145" r="72" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="16 8 4 8" stroke-opacity="0.5" />
      <circle cx="907" cy="145" r="2.5" fill="#10B981" />
      <circle cx="763" cy="145" r="2.5" fill="#EF4444" />
    </g>

    <!-- Glassmorphic Inner Node Enclosure -->
    <circle cx="835" cy="145" r="54" fill="#060C1D" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.2" />

    <!-- Bipartite Graph Edges (Adversary IP to Account) -->
    <!-- Edge 1: Top Red IP -> Blue Account -->
    <line class="edge-animated" x1="775" y1="105" x2="895" y2="105" stroke="#EF4444" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 4" />
    <!-- Edge 2: Top Red IP -> Mid Pivot Center -->
    <line class="edge-animated" x1="775" y1="105" x2="835" y2="145" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4 3" />
    <!-- Edge 3: Bottom Red IP -> Mid Pivot Center -->
    <line class="edge-animated" x1="775" y1="185" x2="835" y2="145" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4 3" />
    <!-- Edge 4: Bottom Red IP -> Bottom Blue Account -->
    <line class="edge-animated" x1="775" y1="185" x2="895" y2="185" stroke="#EF4444" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 4" />
    <!-- Edge 5: Center Pivot -> Blue Accounts -->
    <line class="edge-animated" x1="835" y1="145" x2="895" y2="105" stroke="#00BCF2" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="5 3" />
    <line class="edge-animated" x1="835" y1="145" x2="895" y2="145" stroke="#00BCF2" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="5 3" />
    <line class="edge-animated" x1="835" y1="145" x2="895" y2="185" stroke="#00BCF2" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="5 3" />

    <!-- Left Adversary IP Nodes (Red Threat) -->
    <g transform="translate(775, 105)">
      <circle cx="0" cy="0" r="4.5" fill="#EF4444" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#EF4444" stroke-width="0.8" opacity="0.6" />
    </g>
    <g transform="translate(775, 145)">
      <circle cx="0" cy="0" r="4.5" fill="#EF4444" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#EF4444" stroke-width="0.8" opacity="0.6" />
    </g>
    <g transform="translate(775, 185)">
      <circle cx="0" cy="0" r="4.5" fill="#EF4444" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#EF4444" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Center Pivot Compromise Node (F10_pivot - Golden Flash) -->
    <g class="pivot-pulse" transform="translate(835, 145)">
      <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#0B1329" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#F59E0B" />
    </g>

    <!-- Right Enterprise Account Nodes (Azure Blue) -->
    <g transform="translate(895, 105)">
      <circle cx="0" cy="0" r="4.5" fill="#00BCF2" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#00BCF2" stroke-width="0.8" opacity="0.6" />
    </g>
    <g transform="translate(895, 145)">
      <circle cx="0" cy="0" r="4.5" fill="#00BCF2" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#00BCF2" stroke-width="0.8" opacity="0.6" />
    </g>
    <g transform="translate(895, 185)">
      <circle cx="0" cy="0" r="4.5" fill="#00BCF2" />
      <circle cx="0" cy="0" r="8" fill="none" stroke="#00BCF2" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Micro Typography Labels -->
    <text x="765" y="88" fill="#EF4444" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">IP NODES</text>
    <text x="835" y="172" fill="#F59E0B" class="font-mono" font-size="7.5" font-weight="700" text-anchor="middle">F10 PIVOT</text>
    <text x="905" y="88" fill="#00BCF2" class="font-mono" font-size="8" font-weight="700" text-anchor="middle">ACCOUNTS</text>
  </g>

  <!-- Bottom Razor Hairline -->
  <rect x="0" y="288" width="980" height="2" fill="url(#securityBorder)" opacity="0.9" />
</svg>